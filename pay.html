<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f7fb;
    }

    .box {
      width: 92%;
      max-width: 420px;
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      text-align: center;
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 9px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #0d6efd;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .upi {
      background: #f1f3f5;
      padding: 12px;
      border-radius: 10px;
      margin: 15px 0;
      word-break: break-all;
    }

    #uploadSection {
      display: none;
      margin-top: 20px;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>UPI Payment</h2>

  <input
    type="number"
    id="amount"
    placeholder="Enter amount (₹)"
    min="1"
  >

  <div class="upi">
    UPI ID: <b>9812298270@axl</b>
  </div>

  <button onclick="payNow()">Pay Now</button>

  <div id="uploadSection">

    <p><b>Payment complete hone ke baad screenshot upload karein</b></p>

    <input
      type="file"
      id="screenshot"
      accept="image/*"
    >

    <button onclick="submitScreenshot()">
      Submit Screenshot
    </button>

  </div>

  <div class="status" id="status"></div>

</div>

<script>
  let paymentAmount = "";

  function payNow() {

    const amount = document.getElementById("amount").value;

    if (!amount || Number(amount) <= 0) {
      alert("Please enter a valid amount.");
      return;
    }

    paymentAmount = amount;

    const upiUrl =
      "upi://pay" +
      "?pa=" + encodeURIComponent("9812298270@axl") +
      "&pn=" + encodeURIComponent("Payment") +
      "&am=" + encodeURIComponent(amount) +
      "&cu=INR";

    window.location.href = upiUrl;

    setTimeout(function () {
      document.getElementById("uploadSection").style.display = "block";
    }, 1500);
  }

  function submitScreenshot() {

    const file = document.getElementById("screenshot").files[0];

    if (!file) {
      alert("Please upload your payment screenshot.");
      return;
    }

    document.getElementById("status").innerText =
      "Screenshot selected. Opening WhatsApp...";

    const message =
      "Payment Screenshot Submission\n\n" +
      "Amount: ₹" + paymentAmount +
      "\nScreenshot: I will send it in this WhatsApp chat.";

    const whatsappUrl =
      "https://wa.me/919540823706?text=" +
      encodeURIComponent(message);

    window.location.href = whatsappUrl;
  }
</script>

</body>
</html>
